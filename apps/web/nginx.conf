server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the 20 MB app limit so Laravel returns the friendly validation error.
    client_max_body_size 26m;

    # Same-origin API: the browser never talks to Laravel directly, so no CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large uploads straight through instead of buffering them to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
