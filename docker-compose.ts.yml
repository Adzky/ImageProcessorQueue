name: image-processor-ts

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-images}
      POSTGRES_USER: ${DB_USERNAME:-images}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Backend test runner: docker compose -f docker-compose.ts.yml --profile test run --rm api-test
  api-test:
    profiles: [test]
    build:
      context: ./apps/api-ts
      target: base
    image: image-processor-ts-base
    working_dir: /app
    environment:
      DB_HOST: postgres
      DB_DATABASE: images_test
      REDIS_HOST: redis
      TZ: UTC
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test"]
    volumes:
      - ./apps/api-ts:/app
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
